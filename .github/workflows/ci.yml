name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -e ".[dev,packaging]"
      - name: Run regression tests
        run: python -m pytest -q --junitxml=artifacts/test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: artifacts/test-results.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Build Windows application
        if: matrix.python-version == '3.11'
        run: python -m PyInstaller --noconfirm packaging/pyinstaller.spec
      - name: Check size, dependencies and startup
        if: matrix.python-version == '3.11'
        run: python scripts/check_windows_bundle.py --pyz build/pyinstaller/PYZ-00.pyz --smoke
      - name: Upload tested Windows application
        if: matrix.python-version == '3.11' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-${{ github.sha }}
          path: dist/线下色卡采集工具集/
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
